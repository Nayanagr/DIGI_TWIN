<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urban CO₂ Digital Twin | V4.0 HUD</title>
    <style>
        /* Dark Industrial HUD Aesthetic */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #050505; font-family: 'Courier New', Courier, monospace; }
        
        #workspace { position: relative; width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        #map-container { position: relative; display: inline-block; box-shadow: 0 0 50px rgba(0,0,0,1); }
        #base-map { display: block; max-width: 95vw; max-height: 95vh; opacity: 0.5; }
        
        #heatmap-canvas, #ui-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #heatmap-canvas { z-index: 2; mix-blend-mode: screen; }
        #ui-canvas { z-index: 3; }
        
        /* Tactical Glass-morphism Panel */
        #hud-panel {
            position: absolute; top: 20px; right: 20px; width: 340px; z-index: 10;
            max-height: 95vh; overflow-y: auto;
            background: rgba(15, 15, 15, 0.9); border: 1px solid #333; border-top: 3px solid #d9534f;
            color: #eee; padding: 20px; box-shadow: 0 4px 30px rgba(0,0,0,0.8); backdrop-filter: blur(10px);
        }
        
        h2 { margin: 0 0 10px 0; font-size: 1.1rem; color: #d9534f; text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #333; padding-bottom: 5px;}
        h3 { font-size: 0.85rem; color: #d9534f; text-transform: uppercase; margin: 20px 0 10px 0; border-left: 3px solid #d9534f; padding-left: 10px;}
        
        label { display: block; margin-top: 12px; font-size: 0.75rem; color: #888; text-transform: uppercase; font-weight: bold;}
        input, select { width: 100%; margin-top: 5px; background: #1a1a1a; color: #fff; border: 1px solid #333; padding: 6px; box-sizing: border-box; font-family: inherit; font-size: 0.85rem;}
        input:focus { border-color: #d9534f; outline: none; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        button { flex: 1; padding: 12px; background: #d9534f; color: white; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;}
        button:hover { background: #c9302c; box-shadow: 0 0 15px rgba(217, 83, 79, 0.4); }
        #btn-clear { background: #333; }
        
        .source-list { margin-top: 15px; font-size: 0.7rem; background: #0a0a0a; border: 1px solid #222; max-height: 120px; overflow-y: auto; padding: 5px;}
        .source-item { padding: 6px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center;}
        .source-item span { color: #0f0; font-weight: bold;}
        .btn-delete { background: none; border: none; color: #d9534f; cursor: pointer; padding: 0 8px; font-weight: bold; font-size: 1.1rem;}

        #coord-readout { position: absolute; bottom: 20px; left: 20px; z-index: 10; color: #0f0; font-size: 0.8rem; font-weight: bold; background: rgba(0,0,0,0.9); padding: 8px 15px; border: 1px solid #0f0; text-shadow: 0 0 5px #0f0;}
        
        .type-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
        .type-btn { background: #1a1a1a; color: #666; border: 1px solid #333; padding: 8px; font-size: 0.7rem; text-align: center; cursor: pointer; font-weight: bold; transition: 0.2s; text-transform: uppercase;}
        .type-btn.active { background: #d9534f; color: #fff; border-color: #d9534f; }
        
        #line-hint { font-size: 0.7rem; color: #f0ad4e; margin-top: 8px; text-align: center; font-weight: bold; background: rgba(240, 173, 78, 0.1); padding: 5px; border: 1px dashed #f0ad4e; }
        
        /* Metrics */
        .metrics-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .metric-card { background: #111; border: 1px solid #222; padding: 10px; border-radius: 4px; }
        .metric-label { font-size: 0.6rem; color: #666; text-transform: uppercase; margin-bottom: 4px; }
        .metric-value { font-size: 1rem; color: #0f0; font-weight: bold; }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #333; }
        ::-webkit-scrollbar-thumb:hover { background: #d9534f; }
    </style>
</head>
<body>

    <div id="workspace">
        <div id="map-container">
            <img id="base-map" src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1920&auto=format&fit=crop" alt="Tactical Grid">
            <canvas id="heatmap-canvas"></canvas>
            <canvas id="ui-canvas"></canvas>
        </div>
    </div>

    <div id="hud-panel">
        <h2>Mission Control V4.0</h2>
        
        <label>Operational Overlay</label>
        <input type="file" id="map-upload" accept="image/*">

        <label>Grid Res: <span id="res-val" style="color:#d9534f">100</span></label>
        <input type="range" id="grid-res" min="50" max="500" value="100">

        <h3>Entity Deployment</h3>
        <div class="type-selector">
            <div class="type-btn active" data-type="point">Point Source</div>
            <div class="type-btn" data-type="line">Line Source</div>
            <div class="type-btn" data-type="area">Area Source</div>
            <div class="type-btn" data-type="natural_sink">Natural Sink</div>
            <div class="type-btn" data-type="artificial_sink">Artificial Sink</div>
        </div>
        <div id="line-hint" style="display:none">CLICK START POINT</div>

        <div id="params-point">
            <label>Rate (g/s)</label><input type="number" id="p-rate" value="100">
            <label>Height (m)</label><input type="number" id="p-height" value="50">
        </div>
        <div id="params-line" style="display:none">
            <label>Traffic (veh/s)</label><input type="number" id="l-traffic" value="10">
            <label>Emission Factor</label><input type="number" id="l-ef" value="2.5">
        </div>
        <div id="params-area" style="display:none">
            <label>Radius (px)</label><input type="number" id="a-radius" value="10">
            <label>Intensity</label><input type="number" id="a-intensity" value="20">
        </div>
        <div id="params-sink" style="display:none">
            <label id="cap-label">Capture Capacity</label><input type="number" id="s-cap" value="15">
            <label id="sink-dim-label" style="display:none">Dim (W x H)</label>
            <div style="display:none; gap:5px">
                <input type="number" id="s-w" value="10" placeholder="W">
                <input type="number" id="s-h" value="10" placeholder="H">
            </div>
        </div>

        <h3>Atmosphere</h3>
        <div style="display:flex; gap:10px">
            <div style="flex:1">
                <label>Wind X</label><input type="number" id="wind-x" value="0.2" step="0.1">
            </div>
            <div style="flex:1">
                <label>Wind Y</label><input type="number" id="wind-y" value="0.0" step="0.1">
            </div>
        </div>
        <label>Stability</label>
        <select id="stability-class">
            <option value="A">A - Very Unstable</option>
            <option value="D" selected>D - Neutral</option>
            <option value="F">F - Very Stable</option>
        </select>
        <label>Scale: <span id="mpp-val" style="color:#d9534f">10.0</span> m/px</label>
        <input type="range" id="mpp" min="1" max="50" step="0.5" value="10.0">

        <h3>Active Inventory</h3>
        <div class="source-list" id="entity-list"></div>
        
        <div class="metrics-grid">
            <div class="metric-card"><div class="metric-label">Total CO₂</div><div id="m-total" class="metric-value">0.0</div></div>
            <div class="metric-card"><div class="metric-label">Max Conc</div><div id="m-max" class="metric-value">0.00</div></div>
        </div>

        <div class="btn-group">
            <button id="btn-simulate">Engage</button>
            <button id="btn-clear">Purge</button>
        </div>
    </div>

    <div id="coord-readout">GRID: [X: 0, Y: 0]</div>

    <script src="app.js"></script>
</body>
</html>
